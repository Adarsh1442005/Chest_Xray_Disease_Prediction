<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chest X-Ray Disease Classifier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #333;
    }
    .upload-box {
      margin: 20px auto;
      padding: 20px;
      border: 2px dashed #888;
      border-radius: 10px;
      width: 400px;
      background: #fff;
    }
    input[type="file"] {
      margin: 10px;
    }
    button {
      padding: 10px 20px;
      background: #0078d7;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #005a9e;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #0078d7;
    }
  </style>
</head>
<body>
  <h1>Chest X-Ray Disease Classifier</h1>
  <div class="upload-box">
    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*" required>
      <br>
      <button type="submit">Predict</button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById("uploadForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const response = await fetch("/predict", {
        method: "POST",
        body: formData
      });
      const data = await response.json();
      document.getElementById("result").innerText = "Prediction: " + data.class;
    });
  </script>
</body>
</html>
